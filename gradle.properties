org.gradle.jvmargs = -Xmx2G

# Mod Info
archives_base_name = createtinkeredweapons-multiloader
mod_version = 0.1.0
maven_group = com.ridopipolop.createtinkeredweapons

# Minecraft and Mappings
minecraft_version = 1.20.1
parchment_version = 2023.09.03

# Modloaders
enabled_platforms = fabric,forge
fabric_loader_version = 0.16.10
fabric_api_version = 0.92.3+1.20.1
forge_version = 47.4.16

# Create - Fabric
create_fabric_version = 6.0.8.1+build.1744

# Create - Forge
create_forge_version = 6.0.8-289
registrate_forge_version = MC1.20-1.3.11
flywheel_forge_minecraft_version = 1.20.1
flywheel_forge_version = 1.0.5

# Development QOL
# Create Fabric supports all 3 recipe viewers: JEI, REI, and EMI. This decides which is enabled at runtime.
# set to disabled to have none of them.
fabric_recipe_viewer = jei
# JEI - https://www.curseforge.com/minecraft/mc-mods/jei/files/all
jei_version = 15.20.0.106
# REI - https://modrinth.com/mod/rei/versions
rei_version = 12.1.785
# EMI - https://modrinth.com/mod/emi/versions
emi_version = 1.1.20+1.20.1

# Mod Menu - https://modrinth.com/mod/modmenu/versions
modmenu_version = 7.2.2
